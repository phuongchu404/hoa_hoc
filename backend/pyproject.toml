[project]
name = "chemimage-backend"
version = "1.0.0"
description = "Local image -> chemical structure -> ChemDraw converter (FastAPI)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = [".", "vendor"]
testpaths = ["tests"]
markers = ["slow: loads the ML models (≈10 s start-up)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
